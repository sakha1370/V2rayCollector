name: Collector

# Trigger workflow
on:
  schedule:
    # Run at minute 30 of every hour
    - cron: '30 * * * *'
  workflow_dispatch:  # Allow manual trigger

# Permissions (top-level fallback)
permissions:
  contents: write

concurrency:
  group: Collector
  cancel-in-progress: false


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - uses: actions/setup-go@v4
      with:
        go-version: '>=1.21.3'
    - run: go version

    - name: Build and run Golang file
      run: |
          go build -o myapp
          ./myapp -sort

    - name: Deduplicate MTProto proxies
      run: |
          python3 dedup_mtproto_file.py
          
    - name: Commit Changes
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git pull origin main
        git add .
        git checkout main
        git commit -m "✔️ $(date '+%Y-%m-%d %H:%M:%S') Collected"
    - name: Push Changes
      uses: ad-m/github-push-action@master
      with:
        branch: main

    - name: Create .env from secrets
      run: |
        cat <<EOF > .env
        BOT_TOKEN=${{ secrets.BOT_TOKEN }}
        CHAT_ID=${{ secrets.CHAT_ID }}
        URL_FILES=${{ secrets.URL_FILES }}
        SEND_INLINE_TEXT=${{ secrets.SEND_INLINE_TEXT }}
        EOF

    - name: Make script executable
      run: chmod +x script.sh

    - name: Run script
      run: ./script.sh
